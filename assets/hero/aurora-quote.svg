      <path d="M-80 62C101 135 282 89 446 63C620 36 774 72 934 153C1052 213 1152 211 1288 160V-54H-80V62Z" fill="url(#auroraB)" opacity="0.76"/>
      <ellipse cx="235" cy="270" rx="310" ry="92" fill="#7C3AED" opacity="0.44"/>
