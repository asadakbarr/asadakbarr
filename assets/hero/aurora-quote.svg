<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rest at the end, not in the middle.</title>
  <desc id="desc">Quote by Mr. Fisk, popularized by Kobe Bryant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.48" stop-color="#111B4D"/>
      <stop offset="1" stop-color="#061B2E"/>
    </linearGradient>
    <linearGradient id="auroraA" x1="105" y1="280" x2="1135" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.34" stop-color="#2563EB"/>
      <stop offset="0.7" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="1030" y1="290" x2="145" y2="0" gradientUnits="userSpaceOnUse">
